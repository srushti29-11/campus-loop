<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Campus Loop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(59,130,246,0.16), transparent 35%),
                radial-gradient(circle at bottom left, rgba(37,99,235,0.10), transparent 30%),
                #0b1120;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: rgba(11, 17, 32, 0.95);
            border-bottom: 1px solid #243047;
        }

        .brand {
            color: #60a5fa;
            font-size: 1.35rem;
            font-weight: 700;
            text-decoration: none;
        }

        .brand:hover {
            color: #93c5fd;
        }

        .register-wrapper {
            min-height: calc(100vh - 73px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            background: #111827;
            border: 1px solid #243047;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .register-title {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .register-subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .form-label {
            color: #cbd5e1;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            background: #172033 !important;
            border: 1px solid #2b3850 !important;
            color: #f8fafc !important;
            border-radius: 10px;
            padding: 12px 14px;
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-control:focus {
            background: #172033 !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.15);
        }

        .register-btn {
            background: #2563eb;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .register-btn:hover {
            background: #3b82f6;
            color: white;
            transform: translateY(-1px);
        }

        .login-text {
            color: #94a3b8;
            text-align: center;
            margin-top: 25px;
            margin-bottom: 0;
        }

        .login-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link:hover {
            color: #93c5fd;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back-link:hover {
            color: #60a5fa;
        }

        .alert-danger {
            background: rgba(220, 38, 38, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.35);
            color: #fca5a5;
            border-radius: 10px;
        }

        @media (max-width: 576px) {
            .register-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a href="/" class="brand">
            <i class="bi bi-arrow-left-circle me-2"></i>
            Campus Loop
        </a>
    </div>
</nav>

<div class="register-wrapper">

    <div class="register-card">

        <div class="icon-circle">
            <i class="bi bi-person-plus"></i>
        </div>

        <h1 class="register-title">
            Create Your Account
        </h1>

        <p class="register-subtitle">
            Join Campus Loop and start connecting with students
        </p>

        {% if error %}
            <div class="alert alert-danger mb-4">
                <i class="bi bi-exclamation-circle me-2"></i>
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-person me-1"></i>
                    First Name
                </label>

                <input
                    type="text"
                    name="first_name"
                    class="form-control"
                    placeholder="Enter your first name"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-person me-1"></i>
                    Last Name
                </label>

                <input
                    type="text"
                    name="last_name"
                    class="form-control"
                    placeholder="Enter your last name"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-envelope me-1"></i>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-building me-1"></i>
                    College
                </label>

                <input
                    type="text"
                    name="college"
                    class="form-control"
                    placeholder="Enter your college name"
                    required
                >
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-lock me-1"></i>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn register-btn w-100"
            >
                <i class="bi bi-person-check me-2"></i>
                Create Account
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="{% url 'login' %}" class="login-link">
                Login
            </a>
        </p>

        <a href="/" class="back-link">
            <i class="bi bi-house me-1"></i>
            Back to Campus Loop
        </a>

    </div>

</div>

</body>
</html>
