<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Campus Loop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .form-control {
            padding: 11px;
            border-radius: 10px;
        }

        .btn-register {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            font-weight: 600;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="logo">Campus Loop</div>

    <div class="subtitle">
        Create your student account
    </div>

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <!-- First Name -->
        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input
                type="text"
                name="first_name"
                class="form-control"
                placeholder="Enter your first name"
                required
            >
        </div>

        <!-- Last Name -->
        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input
                type="text"
                name="last_name"
                class="form-control"
                placeholder="Enter your last name"
                required
            >
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >
        </div>

        <!-- College -->
        <div class="mb-3">
            <label class="form-label">College</label>
            <input
                type="text"
                name="college"
                class="form-control"
                placeholder="Enter your college name"
                required
            >
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Create a password"
                required
            >
        </div>

        <!-- Register Button -->
        <button type="submit" class="btn btn-primary btn-register">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </div>

</div>

</body>
</html>
